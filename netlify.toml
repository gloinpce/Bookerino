# Netlify Build Configuration for Vite + React

# Build settings
[build]
  # Base directory for the build
  base = "."
  
  # Build command - install dependencies and build with Vite
  # Remove node_modules and package-lock.json to fix Rollup native module issues
  # Then do a fresh install with optional dependencies and build
  command = "rm -rf node_modules package-lock.json && npm cache clean --force && npm install --legacy-peer-deps --include=optional --no-audit && npm run build"
  
  # Publish directory (where Vite outputs the built files)
  # Based on vite.config.ts, output is in dist/public
  publish = "dist/public"

# Environment variables
[build.environment]
  # Vite 6 requires Node.js 18+ or 20+
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  # Explicitly disable Next.js detection
  NEXT_PRIVATE_TARGET = ""
  # Disable telemetry to speed up builds
  VITE_TELEMETRY_DISABLED = "1"
  # Fix Neon extension logger error - set LOG_LEVEL to match extension expectations
  LOG_LEVEL = "info"
  # Netlify DB will automatically set DATABASE_URL and NETLIFY_DATABASE_URL
  # These are available during build and in Netlify Functions
  # Configure secrets scanning to ignore false positives
  # These environment variables tell Netlify to skip scanning certain keys and paths
  SECRETS_SCAN_OMIT_KEYS = "LOG_LEVEL"
  # Omit paths that contain false positives (documentation, build artifacts, etc.)
  SECRETS_SCAN_OMIT_PATHS = "dist/**,target/**,*.md,*.png,*.jpg,*.jar,*.class,.netlify/**,.github/**,.vscode/**,.local/**,figma-design-files/**,Bookerino/**"
  # Disable secrets scanning for DATABASE_URL since it's expected in code (as env var name)
  # Note: Actual database passwords should NEVER be in code - only use environment variables

# Explicitly disable Next.js plugin
# This prevents Netlify from auto-detecting Next.js
[build.processing]
  skip_processing = false

# Redirects for SPA routing
# Serve index.html as default (for React Router)
# This ensures React Router handles all routes
# Static assets (JS, CSS, images) are served directly by Netlify
# Only HTML routes are redirected to index.html for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# IMPORTANT: This is a Vite + React project, NOT Next.js
# If plugins are still being installed, remove them manually in Netlify Dashboard:
# Site settings → Build & deploy → Build plugins → Remove @netlify/plugin-nextjs
