# Netlify Build Configuration for Vite + React

# Build settings
[build]
  # Base directory for the build
  base = "."
  
  # Build command - install dependencies and build with Vite
  command = "npm install && npm run build"
  
  # Publish directory (where Vite outputs the built files)
  # Based on vite.config.ts, output is in dist/public
  publish = "dist/public"

# Environment variables
[build.environment]
  # Vite 7 requires Node.js 20.19+ or 22.12+
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# Redirects for SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# CRITICAL: This is a Vite + React project, NOT Next.js
# You MUST disable Next.js plugins in Netlify Dashboard:
# 1. Go to: Site settings → Build & deploy → Build plugins
# 2. DELETE/REMOVE these plugins:
#    - @netlify/plugin-nextjs (MUST REMOVE)
#    - netlify-plugin-html-validate (optional)
#    - @netlify/plugin-lighthouse (optional)
# 3. Save changes
# Without removing Next.js plugin, builds will fail!
