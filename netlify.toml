# Netlify Build Configuration

# Build settings
[build]
  # Base directory for the build (where package.json is located)
  base = "."
  
  # Build command - install dependencies and build
  command = "npm install && npm run build"
  
  # Publish directory (where the built files are output)
  # Based on vite.config.ts, output is in dist/public
  publish = "dist/public"

# Environment variables
[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS = "--legacy-peer-deps"

# Redirects for SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200


