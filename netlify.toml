# Netlify Build Configuration for Vite + React

# Build settings
[build]
  # Base directory for the build
  base = "."
  
  # Build command - install dependencies and build with Vite
  command = "npm install && npm run build"
  
  # Publish directory (where Vite outputs the built files)
  # Based on vite.config.ts, output is in dist/public
  publish = "dist/public"

# Environment variables
[build.environment]
  # Vite 7 requires Node.js 20.19+ or 22.12+
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# Redirects for SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Note: This is a Vite + React project, NOT Next.js
# IMPORTANT: You MUST disable Next.js plugins in Netlify Dashboard:
# Site settings → Build & deploy → Build plugins → Remove all Next.js plugins
